<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Topics | Futuristic Reader</title>
  <style>
    /* Global Reset & Futuristic Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050811;
      color: #f0f4f8;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Grid Background */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(to right, rgba(0, 242, 254, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    /* Ambient Glowing Orbs */
    .orb {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      opacity: 0.5;
      animation: float 8s ease-in-out infinite alternate;
    }
    .orb-1 {
      top: 10%;
      left: 15%;
      background: #4f46e5;
    }
    .orb-2 {
      bottom: 15%;
      right: 15%;
      background: #00f2fe;
      animation-delay: -4s;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.1); }
    }

    /* Main Glassmorphism Container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      width: 90%;
      padding: 40px;
      background: rgba(13, 18, 36, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 24px;
      box-shadow: 0 0 50px rgba(0, 242, 254, 0.1);
      text-align: center;
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Futuristic Tag */
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: #00f2fe;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }

    /* Heading with Gradient Text */
    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1.15rem;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto 36px auto;
    }

    /* Interactive Card Link */
    .card-link {
      display: block;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .card-link::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      transition: left 0.6s ease;
    }

    .card-link:hover::before {
      left: 100%;
    }

    .card-link:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 242, 254, 0.6);
      background: rgba(0, 242, 254, 0.05);
      box-shadow: 0 10px 30px -10px rgba(0, 242, 254, 0.3);
    }

    .card-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .card-text {
      text-align: left;
    }

    .card-title {
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-desc {
      color: #64748b;
      font-size: 0.95rem;
    }

    /* Glowing Action Icon */
    .action-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #00f2fe;
      color: #050811;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .card-link:hover .action-btn {
      transform: scale(1.1) rotate(-45deg);
    }

    /* Entrance Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive Adjustments */
    @media (max-width: 600px) {
      .container { padding: 24px; }
      h1 { font-size: 2rem; }
      .card-content { flex-direction: column; align-items: flex-start; }
      .action-btn { align-self: flex-end; }
    }
  </style>
</head>
<body>

  <!-- Ambient background lighting -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Main glass card -->
  <div class="container">
    <span class="badge">AI Intelligence Portal</span>
    <h1>Explore the Future of AI</h1>
    <p class="subtitle">Step into a curated journey through modern artificial intelligence concepts, frameworks, and breakthroughs.</p>

    <!-- Interactive Link Card -->
    <a href="https://sunilkrbajpai.github.io/AI-Topics/day1.html" class="card-link">
      <div class="card-content">
        <div class="card-text">
          <div class="card-title">
            <span>🚀</span> Day 1: Foundations & Architecture
          </div>
          <div class="card-desc">Begin your reading session with core AI principles and initial concepts.</div>
        </div>
        <div class="action-btn">→</div>
      </div>
    </a>
  </div>

</body>
</html>
